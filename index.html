<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta http-equiv="Content-Security-Policy" content="object-src 'none'; base-uri 'self'; form-action 'self' https://news.winvestcapital.nl; upgrade-insecure-requests" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <meta name="theme-color" content="#0a0a0b" />
    <script>
      // Light theme, set before the first paint so the page does not flash. Dark is the default.
      try {
        if (localStorage.getItem('wc-theme') === 'light') {
          document.documentElement.dataset.theme = 'light';
          document.querySelector('meta[name="theme-color"]').content = '#f6f6f7';
        }
      } catch (e) {}
    </script>
    <link rel="icon" href="/favicon.ico" sizes="48x48" />
    <link rel="icon" href="/favicon.svg" type="image/svg+xml" />
    <link rel="apple-touch-icon" href="/app-icon-180.png" />
    <link rel="manifest" href="/app.webmanifest" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-title" content="Winvest" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black" />
    <!--app-head-->
    <script>
      // Google Analytics 4 (G-57B9Q37X55), loaded only after consent (AVG/GDPR).
      (function () {
        var GA_ID = 'G-57B9Q37X55', KEY = 'wc-consent';
        function get() { try { return localStorage.getItem(KEY) } catch (e) { return null } }
        function set(v) { try { localStorage.setItem(KEY, v) } catch (e) {} }
        function loadGA() {
          if (window.__wcGA) return; window.__wcGA = 1;
          window.dataLayer = window.dataLayer || [];
          window.gtag = function () { dataLayer.push(arguments) };
          gtag('js', new Date()); gtag('config', GA_ID);
          var s = document.createElement('script'); s.async = 1;
          s.src = 'https://www.googletagmanager.com/gtag/js?id=' + GA_ID;
          document.head.appendChild(s);
        }
        function clearGA() {
          document.cookie.split(';').forEach(function (c) {
            var n = c.split('=')[0].trim();
            if (/^_ga/.test(n)) ['', '.' + location.hostname.replace(/^www\./, '')].forEach(function (d) {
              document.cookie = n + '=; Max-Age=0; path=/' + (d ? '; domain=' + d : '');
            });
          });
        }
        function banner() {
          if (document.getElementById('wc-consent')) return;
          var nl = document.documentElement.lang === 'nl';
          var t = nl
            ? { m: 'We gebruiken Google Analytics om te meten hoe de website wordt gebruikt. Alleen met je toestemming.', a: 'Accepteren', d: 'Weigeren', p: 'Privacy', u: '/nl/privacy/' }
            : { m: 'We use Google Analytics to measure how this website is used. Only with your consent.', a: 'Accept', d: 'Decline', p: 'Privacy', u: '/legal/privacy/' };
          var b = document.createElement('div'); b.id = 'wc-consent'; b.setAttribute('role', 'dialog'); b.setAttribute('aria-label', 'Cookies');
          b.style.cssText = 'position:fixed;left:16px;right:16px;bottom:16px;z-index:50;max-width:560px;margin:0 auto;background:var(--wc-panel);color:var(--wc-text);border:1px solid var(--wc-line);border-radius:14px;padding:16px 18px;font:14px/1.5 Inter,system-ui,sans-serif;box-shadow:0 10px 30px rgba(0,0,0,.5)';
          var btn = 'border-radius:999px;padding:8px 16px;font-weight:600;font-size:14px;cursor:pointer;';
          b.innerHTML = '<p style="margin:0 0 12px;color:var(--wc-muted)">' + t.m + ' <a href="' + t.u + '" style="color:var(--wc-text);text-decoration:underline">' + t.p + '</a></p>'
            + '<div style="display:flex;gap:8px;justify-content:flex-end">'
            + '<button type="button" data-v="denied" style="' + btn + 'background:transparent;color:var(--wc-text);border:1px solid var(--wc-line)">' + t.d + '</button>'
            + '<button type="button" data-v="granted" style="' + btn + 'background:#FE0000;color:#fff;border:1px solid #FE0000">' + t.a + '</button></div>';
          b.addEventListener('click', function (e) {
            var v = e.target.getAttribute && e.target.getAttribute('data-v'); if (!v) return;
            set(v); b.remove();
            if (v === 'granted') loadGA(); else if (window.__wcGA) { clearGA(); location.reload() } else clearGA();
          });
          document.body.appendChild(b);
        }
        document.addEventListener('click', function (e) {
          var a = e.target.closest && e.target.closest('[data-cookie-settings]');
          if (a) { e.preventDefault(); banner() }
        });
        var c = get();
        if (c === 'granted') loadGA();
        else if (c !== 'denied') document.addEventListener('DOMContentLoaded', banner);
      })();
    </script>
    <script>
      // Installable web app (PWA): service worker + install button/banner for Android and iOS.
      (function () {
        if ('serviceWorker' in navigator) window.addEventListener('load', function () { navigator.serviceWorker.register('/sw.js').catch(function () {}) });
        var standalone = window.matchMedia('(display-mode: standalone)').matches || navigator.standalone === true;
        if (standalone) document.documentElement.classList.add('pwa');
        function markTab() {
          var path = location.pathname, best = null;
          document.querySelectorAll('[data-tab]').forEach(function (a) {
            var t = a.getAttribute('data-tab'), home = t === '/' || t === '/nl/';
            if (home ? path === t : path.indexOf(t) === 0) best = a;
          });
          if (best) best.setAttribute('aria-current', 'page');
        }
        var ua = navigator.userAgent;
        var ios = /iPhone|iPad|iPod/.test(ua) || (navigator.platform === 'MacIntel' && navigator.maxTouchPoints > 1);
        var mobile = ios || /Android/.test(ua);
        var deferred = null;
        var nl = function () { return document.documentElement.lang === 'nl' };
        function store(k, v) { try { return v === undefined ? localStorage.getItem(k) : localStorage.setItem(k, v) } catch (e) { return null } }
        function buttons(show) { document.querySelectorAll('[data-install-app]').forEach(function (b) { b.hidden = !show }) }
        function sheet() {
          if (document.getElementById('wc-install')) return;
          var t = nl()
            ? { h: 'Installeer Winvest Capital', ios: 'Tik in Safari op <b>Deel</b> (het vierkant met de pijl omhoog) en kies <b>Zet op beginscherm</b>.', other: 'Open het menu van je browser en kies <b>App installeren</b> of <b>Toevoegen aan startscherm</b>.', c: 'Sluiten' }
            : { h: 'Install Winvest Capital', ios: 'In Safari, tap <b>Share</b> (the square with the arrow) and choose <b>Add to Home Screen</b>.', other: 'Open your browser menu and choose <b>Install app</b> or <b>Add to Home screen</b>.', c: 'Close' };
          var d = document.createElement('div'); d.id = 'wc-install'; d.setAttribute('role', 'dialog');
          d.style.cssText = 'position:fixed;left:16px;right:16px;bottom:16px;z-index:60;max-width:440px;margin:0 auto;background:var(--wc-panel);color:var(--wc-text);border:1px solid var(--wc-line);border-radius:14px;padding:16px 18px;font:14px/1.5 Inter,system-ui,sans-serif;box-shadow:0 10px 30px rgba(0,0,0,.5)';
          d.innerHTML = '<div style="display:flex;gap:12px;align-items:flex-start"><img src="/app-icon-192.png" alt="" width="40" height="40" style="border-radius:10px;background:#fff">'
            + '<div style="flex:1"><p style="margin:0 0 4px;font-weight:700">' + t.h + '</p><p style="margin:0;color:var(--wc-muted)">' + (ios ? t.ios : t.other) + '</p></div></div>'
            + '<div style="text-align:right;margin-top:10px"><button type="button" style="border-radius:999px;padding:7px 16px;font-weight:600;font-size:14px;cursor:pointer;background:transparent;color:var(--wc-text);border:1px solid var(--wc-line)">' + t.c + '</button></div>';
          d.querySelector('button').onclick = function () { d.remove() };
          document.body.appendChild(d);
        }
        function install() {
          if (deferred) { deferred.prompt(); deferred.userChoice.finally(function () { deferred = null }); return }
          sheet();
        }
        function banner() {
          if (standalone || !mobile || store('wc-install-dismissed') || !store('wc-consent') || document.getElementById('wc-consent')) return;
          var t = nl() ? { m: 'Zet Winvest Capital als app op je telefoon.', a: 'Installeren', d: 'Niet nu' } : { m: 'Add Winvest Capital to your phone as an app.', a: 'Install', d: 'Not now' };
          var b = document.createElement('div'); b.id = 'wc-install-bar';
          b.style.cssText = 'position:fixed;left:12px;right:12px;bottom:12px;z-index:55;display:flex;gap:10px;align-items:center;background:var(--wc-panel);color:var(--wc-text);border:1px solid var(--wc-line);border-radius:14px;padding:10px 12px;font:14px/1.4 Inter,system-ui,sans-serif;box-shadow:0 10px 30px rgba(0,0,0,.5)';
          var btn = 'border-radius:999px;padding:7px 14px;font-weight:600;font-size:13px;cursor:pointer;white-space:nowrap;';
          b.innerHTML = '<img src="/app-icon-192.png" alt="" width="32" height="32" style="border-radius:8px;background:#fff"><span style="flex:1">' + t.m + '</span>'
            + '<button type="button" data-x style="' + btn + 'background:transparent;color:var(--wc-muted);border:0">' + t.d + '</button>'
            + '<button type="button" data-i style="' + btn + 'background:#FE0000;color:#fff;border:0">' + t.a + '</button>';
          b.querySelector('[data-x]').onclick = function () { store('wc-install-dismissed', '1'); b.remove() };
          b.querySelector('[data-i]').onclick = function () { b.remove(); install() };
          document.body.appendChild(b);
        }
        window.addEventListener('beforeinstallprompt', function (e) { e.preventDefault(); deferred = e; buttons(true) });
        window.addEventListener('appinstalled', function () { deferred = null; buttons(false); var b = document.getElementById('wc-install-bar'); if (b) b.remove() });
        document.addEventListener('click', function (e) {
          var a = e.target.closest && e.target.closest('[data-install-app]');
          if (a) { e.preventDefault(); install() }
        });
        document.addEventListener('DOMContentLoaded', function () {
          markTab();
          if (standalone) return;
          if (mobile) buttons(true);
          setTimeout(banner, 4000);
        });
      })();
    </script>
  </head>
  <body>
    <div id="root"><!--app-html--></div>
    <script type="module" src="/src/entry-client.tsx"></script>
  </body>
</html>
