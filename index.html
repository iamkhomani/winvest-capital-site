<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="theme-color" content="#0a0a0b" />
    <link rel="icon" href="/logo.jpeg" type="image/jpeg" />
    <!--app-head-->
    <script>
      // Google Analytics 4 (G-57B9Q37X55), loaded only after consent (AVG/GDPR).
      (function () {
        var GA_ID = 'G-57B9Q37X55', KEY = 'wc-consent';
        function get() { try { return localStorage.getItem(KEY) } catch (e) { return null } }
        function set(v) { try { localStorage.setItem(KEY, v) } catch (e) {} }
        function loadGA() {
          if (window.__wcGA) return; window.__wcGA = 1;
          window.dataLayer = window.dataLayer || [];
          window.gtag = function () { dataLayer.push(arguments) };
          gtag('js', new Date()); gtag('config', GA_ID);
          var s = document.createElement('script'); s.async = 1;
          s.src = 'https://www.googletagmanager.com/gtag/js?id=' + GA_ID;
          document.head.appendChild(s);
        }
        function clearGA() {
          document.cookie.split(';').forEach(function (c) {
            var n = c.split('=')[0].trim();
            if (/^_ga/.test(n)) ['', '.' + location.hostname.replace(/^www\./, '')].forEach(function (d) {
              document.cookie = n + '=; Max-Age=0; path=/' + (d ? '; domain=' + d : '');
            });
          });
        }
        function banner() {
          if (document.getElementById('wc-consent')) return;
          var nl = document.documentElement.lang === 'nl';
          var t = nl
            ? { m: 'We gebruiken Google Analytics om te meten hoe de website wordt gebruikt. Alleen met je toestemming.', a: 'Accepteren', d: 'Weigeren', p: 'Privacy', u: '/nl/privacy/' }
            : { m: 'We use Google Analytics to measure how this website is used. Only with your consent.', a: 'Accept', d: 'Decline', p: 'Privacy', u: '/legal/privacy/' };
          var b = document.createElement('div'); b.id = 'wc-consent'; b.setAttribute('role', 'dialog'); b.setAttribute('aria-label', 'Cookies');
          b.style.cssText = 'position:fixed;left:16px;right:16px;bottom:16px;z-index:50;max-width:560px;margin:0 auto;background:#141414;color:#fff;border:1px solid rgba(255,255,255,.15);border-radius:14px;padding:16px 18px;font:14px/1.5 Inter,system-ui,sans-serif;box-shadow:0 10px 30px rgba(0,0,0,.5)';
          var btn = 'border-radius:999px;padding:8px 16px;font-weight:600;font-size:14px;cursor:pointer;';
          b.innerHTML = '<p style="margin:0 0 12px;color:rgba(255,255,255,.8)">' + t.m + ' <a href="' + t.u + '" style="color:#fff;text-decoration:underline">' + t.p + '</a></p>'
            + '<div style="display:flex;gap:8px;justify-content:flex-end">'
            + '<button type="button" data-v="denied" style="' + btn + 'background:transparent;color:#fff;border:1px solid rgba(255,255,255,.3)">' + t.d + '</button>'
            + '<button type="button" data-v="granted" style="' + btn + 'background:#FE0000;color:#fff;border:1px solid #FE0000">' + t.a + '</button></div>';
          b.addEventListener('click', function (e) {
            var v = e.target.getAttribute && e.target.getAttribute('data-v'); if (!v) return;
            set(v); b.remove();
            if (v === 'granted') loadGA(); else if (window.__wcGA) { clearGA(); location.reload() } else clearGA();
          });
          document.body.appendChild(b);
        }
        document.addEventListener('click', function (e) {
          var a = e.target.closest && e.target.closest('[data-cookie-settings]');
          if (a) { e.preventDefault(); banner() }
        });
        var c = get();
        if (c === 'granted') loadGA();
        else if (c !== 'denied') document.addEventListener('DOMContentLoaded', banner);
      })();
    </script>
  </head>
  <body>
    <div id="root"><!--app-html--></div>
    <script type="module" src="/src/entry-client.tsx"></script>
  </body>
</html>
