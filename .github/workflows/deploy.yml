name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:
  # Weekly market data snapshot (coin pages, DefiLlama map): Monday 04:17 UTC.
  # Daily DeFi market snapshot (DeFi Scanner): every day 05:23 UTC.
  schedule:
    - cron: '17 4 * * 1'
    - cron: '23 5 * * *'

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      # npm ci installs exactly the versions in package-lock.json (no surprise updates)
      - run: npm ci
      - name: Refresh market data snapshot (weekly schedule and manual runs only)
        if: github.event_name == 'workflow_dispatch' || github.event.schedule == '17 4 * * 1'
        continue-on-error: true
        run: |
          node scripts/fetch-data.mjs
          git config user.name "github-actions[bot]"
          git config user.email "41898283+github-actions[bot]@users.noreply.github.com"
          git add src/data/coin-index.json data/coins.json public/data/llama.json public/data/sectors.json
          git diff --cached --quiet || (git commit -m "Weekly market data snapshot" && git push)
      - name: Refresh DeFi market snapshot (schedule and manual runs only)
        if: github.event_name != 'push'
        continue-on-error: true
        run: |
          node scripts/defi-market.mjs
          git config user.name "github-actions[bot]"
          git config user.email "41898283+github-actions[bot]@users.noreply.github.com"
          git pull --rebase --quiet || true
          git add public/data/defi-market.json
          git diff --cached --quiet || (git commit -m "Daily DeFi market snapshot" && git push)
      - name: Security audit of production dependencies (report only)
        run: npm audit --omit=dev || true
      - name: Build
        shell: bash
        run: |
          set -o pipefail
          if ! npm run build 2>&1 | tee build.log; then
            msg=$(grep -E "error|Error" build.log | head -30 | sed ':a;N;$!ba;s/%/%25/g;s/\r/%0D/g;s/\n/%0A/g')
            echo "::error title=Build failed::${msg}"
            exit 1
          fi
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist
  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
