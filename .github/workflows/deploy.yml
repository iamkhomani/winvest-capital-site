name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      # TEMP: new dependencies (EvilCharts) -> regenerate the lockfile once
      - run: npm install
      - name: Print package-lock.json (one-time)
        run: echo "LOCKB64:$(gzip -9c package-lock.json | base64 -w0)"
      - name: Security audit of production dependencies (report only)
        run: npm audit --omit=dev || true
      - name: Build
        shell: bash
        run: |
          set -o pipefail
          if ! npm run build 2>&1 | tee build.log; then
            msg=$(grep -E "error|Error" build.log | head -30 | sed ':a;N;$!ba;s/%/%25/g;s/\r/%0D/g;s/\n/%0A/g')
            echo "::error title=Build failed::${msg}"
            exit 1
          fi
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist
  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
