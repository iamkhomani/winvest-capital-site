{{ define "header" }}
<!doctype html>
<html>
    <head>
        <meta http-equiv="Content-Type" content="text/html; charset=utf-8" />
        <meta name="viewport" content="width=device-width, initial-scale=1, minimum-scale=1" />
        <meta name="color-scheme" content="light only" />
        <base target="_blank">
        <style>
            body { background-color: #F5F3EF; font-family: Inter, 'Segoe UI', Helvetica, Arial, sans-serif; font-size: 16px; line-height: 1.6; margin: 0; color: #141414; }
            .wrap { background-color: #FFFFFF; padding: 36px 40px 30px; max-width: 560px; margin: 0 auto; border-radius: 0 0 12px 12px; border-top: 4px solid #DA291C; }
            .brand { max-width: 640px; margin: 0 auto; padding: 0 4px 16px; }
            .brand a { text-decoration: none; }
            .brand img { width: 40px; height: 40px; border-radius: 999px; vertical-align: middle; border: 0; }
            .brand span { display: inline-block; vertical-align: middle; margin-left: 10px; font-size: 18px; font-weight: 800; color: #141414; letter-spacing: -0.3px; }
            .brand span b { color: #DA291C; font-weight: 600; letter-spacing: 2px; }
            .kicker { margin: 0 0 10px; font-size: 12px; font-weight: 700; letter-spacing: 1.5px; text-transform: uppercase; color: #DA291C; }
            h1, h2 { margin: 0 0 16px; font-size: 26px; line-height: 1.2; font-weight: 800; color: #141414; letter-spacing: -0.5px; }
            p { margin: 0 0 16px; }
            ul { margin: 0 0 16px; padding-left: 20px; }
            .muted { color: #5F5B55; font-size: 14px; }
            .button { background: #DA291C; color: #FFFFFF !important; display: inline-block; border-radius: 999px; padding: 13px 28px; text-align: center; text-decoration: none; font-weight: 700; font-size: 15px; }
            a { color: #DA291C; }
            .footer { max-width: 560px; margin: 24px auto 0; background: #141414; border-radius: 12px; padding: 24px 28px; color: #9A958D; font-size: 12px; line-height: 1.55; }
            .footer strong { display: block; color: #FFFFFF; font-size: 15px; margin-bottom: 6px; }
            .footer a { color: #FFFFFF; }
            .gutter { padding: 24px 12px; }
            img { max-width: 100%; }
            @media screen and (max-width: 600px) { .wrap { padding: 28px 22px; } .gutter { padding: 12px 6px; } }
        </style>
    </head>
<body style="background-color: #F5F3EF;">
    <div class="gutter">
    <div class="brand">
        <a href="https://winvestcapital.nl"><img src="https://winvestcapital.nl/logo.jpeg" alt="Winvest Capital" /><span>WINVEST <b>CAPITAL</b></span></a>
    </div>
    <div class="wrap">
{{ end }}

{{ define "footer" }}
    </div>
    <div class="footer">
        <strong>Elevate your trades, empower your future.</strong>

        Everything Winvest Capital shares is for educational purposes only and is not financial advice.
    </div>
    </div>
</body>
</html>
{{ end }}
